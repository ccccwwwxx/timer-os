name: i18n consistency

on:
  pull_request:
    paths:
      - 'README.md'
      - 'README.zh-CN.md'
      - 'README.ja.md'
      - 'README.ko.md'
      - 'README.es.md'
      - 'docs/i18n/**'
      - 'scripts/check_i18n.py'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'README.zh-CN.md'
      - 'README.ja.md'
      - 'README.ko.md'
      - 'README.es.md'
      - 'docs/i18n/**'
      - 'scripts/check_i18n.py'

jobs:
  check-i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check documentation versions
        run: python scripts/check_i18n.py
